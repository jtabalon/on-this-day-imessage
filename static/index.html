<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On This Day — iMessage</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div id="sidebar-header">
                <div id="sidebar-header-top">
                    <h1>On This Day</h1>
                    <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                        <span id="theme-icon">&#9790;</span>
                    </button>
                </div>
                <div id="date-picker-row">
                    <input type="date" id="date-picker">
                    <button id="today-btn" title="Go to today">Today</button>
                </div>
                <div id="date-nav-row">
                    <button id="prev-day-btn" title="Previous day" aria-label="Previous day">&lsaquo;</button>
                    <div id="date-label"></div>
                    <button id="next-day-btn" title="Next day" aria-label="Next day">&rsaquo;</button>
                </div>
                <div id="search-wrapper">
                    <span id="search-icon">&#128269;</span>
                    <input type="search" id="search-input" placeholder="Search conversations..." autocomplete="off">
                </div>
            </div>
            <div id="conversation-list"></div>
        </aside>
        <main id="message-area">
            <div id="message-header">
                <button id="back-btn" title="Back to conversations">&larr;</button>
                <div id="message-header-info">
                    <h2 id="chat-name"></h2>
                    <div id="year-nav"></div>
                </div>
            </div>
            <div id="messages-container">
                <div id="empty-state">
                    <div class="empty-icon">&#128172;</div>
                    <p>Select a conversation to view messages from this day</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
